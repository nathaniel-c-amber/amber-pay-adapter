# ------------------------------------------------------------------
# Amber Pay Ledger — full deployment stack
#
# Services:
#   db    — PostgreSQL 16 (persistent volume, healthchecked)
#   api   — backend server (Node 20, built from server/Dockerfile)
#   web   — frontend SPA (nginx, built from web/Dockerfile)
#   ngrok — public tunnel for cross-internet testing (opt-in profile)
#
# Secrets are read from a root `.env` file (docker-compose loads it
# automatically). See `.env.example` / README for the required vars.
# NEVER commit real secrets.
#
# The ngrok tunnel is opt-in so a normal `docker compose up` stays local.
# Start it with:
#   docker compose --profile tunnel up --build
# It exposes the `web` service, which already proxies /api to `api`, so the
# entire app is reachable through a single public HTTPS URL.
# ------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amber}
      POSTGRES_DB: ${POSTGRES_DB:-amber}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amber} -d ${POSTGRES_DB:-amber}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - amber

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # Runtime mode, read from the root `.env`. Under `development` the API
      # returns the 2FA code (and invite/reset tokens) in its responses so the
      # sign-in flow can be completed without a mailbox; the console fills the
      # code into the form. Those values are credentials — keep the default
      # `production` on anything shared or public.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3300
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Rotating file log, kept on a named volume so it survives a
      # `docker compose up --build` and can be read with
      # `docker compose exec api cat /app/logs/server.log`.
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_DIR: /app/logs
      LOG_MAX_SIZE_BYTES: ${LOG_MAX_SIZE_BYTES:-5242880}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
      DATABASE_URL: postgres://${POSTGRES_USER:-amber}:${POSTGRES_PASSWORD:-amber}@db:5432/${POSTGRES_DB:-amber}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-0123456789abcdef}
      JWT_TTL: ${JWT_TTL:-1h}
      INVITE_TTL: ${INVITE_TTL:-48h}
      TWO_FACTOR_TTL: ${TWO_FACTOR_TTL:-5m}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Reverse proxies in front of the API. Raise to 2 when the ngrok tunnel
      # profile is active (nginx + ngrok). See server/.env.example.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # The ONE organization this deployment serves. Every stored row and every
      # generated policy attribute must agree on this value; when they disagree
      # the symptom is an empty console rather than an error.
      ORGANIZATION_ID: ${ORGANIZATION_ID:-default}
      # The ONE accounting system this deployment integrates with. The other one
      # stays in the image but is never probed, listed or pushed to, so an
      # operator is not shown a connection they never chose.
      ADAPTOR_ID: ${ADAPTOR_ID:-quickbooks}
      # Credential encryption (needed once the onboarding wizard stores a gateway
      # or accounting credential). Generate with `openssl rand -hex 32`. Blank is
      # accepted: the API still starts, it just cannot store credentials.
      SECRETS_KEY: ${SECRETS_KEY:-}
      SECRETS_KEY_VERSION: ${SECRETS_KEY_VERSION:-1}
      SECRETS_KEY_PREVIOUS: ${SECRETS_KEY_PREVIOUS:-}
      # Super admin bootstrap (optional). Setting BOTH seeds a super admin
      # (all privileges, all scopes/orgs) on install.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      # Amber Pay gateway
      AMBER_PAY_BASE_URL: ${AMBER_PAY_BASE_URL:-https://api.amberpay.example.com}
      AMBER_PAY_WEBHOOK_SECRET: ${AMBER_PAY_WEBHOOK_SECRET:-change-me-webhook-secret}
      # No real gateway upstream yet, so POST /payments 502s by default. Set
      # true in the root .env to fabricate links locally. The API additionally
      # refuses this in production, so the public `tunnel` profile cannot be
      # talked into exposing a payment-minting endpoint.
      AMBER_PAY_DEV_TRANSPORT: ${AMBER_PAY_DEV_TRANSPORT:-false}
      # QuickBooks
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_BASE_URL: ${QUICKBOOKS_BASE_URL:-https://quickbooks.api.intuit.com}
      QUICKBOOKS_REALM_ID: ${QUICKBOOKS_REALM_ID:-}
      # A bearer token is what authorizes a call; client id/secret alone cannot
      # mint one. Set an access token, or a refresh token for the adaptor to
      # exchange (and re-exchange when the access token expires).
      QUICKBOOKS_ACCESS_TOKEN: ${QUICKBOOKS_ACCESS_TOKEN:-}
      QUICKBOOKS_REFRESH_TOKEN: ${QUICKBOOKS_REFRESH_TOKEN:-}
      # Sage
      SAGE_CLIENT_ID: ${SAGE_CLIENT_ID:-}
      SAGE_CLIENT_SECRET: ${SAGE_CLIENT_SECRET:-}
      SAGE_BASE_URL: ${SAGE_BASE_URL:-https://api.sage.com}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-starttls}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Bound to loopback on purpose. The API is reached through the `web`
      # service (nginx proxies /api to api:3300); publishing 3300 on every host
      # interface would expose the backend directly and let a caller bypass
      # nginx AND spoof `X-Forwarded-For` to evade the per-IP rate limits.
      - "127.0.0.1:3300:3300"
    volumes:
      - api-logs:/app/logs
    networks:
      - amber

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1, NOT localhost: nginx listens on IPv4 only (0.0.0.0:80) while
      # `localhost` resolves to ::1 inside this Alpine image, so the check was
      # refused and the container reported `unhealthy` while serving perfectly
      # well. Measured: `wget http://127.0.0.1/` 200, `wget http://localhost/`
      # connection refused, `netstat` shows 0.0.0.0:80 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8080:80"
    networks:
      - amber

  # Public tunnel for testing across the internet. Opt-in via the `tunnel`
  # profile so a plain `docker compose up` never exposes the stack.
  #
  #   docker compose --profile tunnel up --build
  #
  # Tunnels the `web` service (nginx), which proxies /api to `api`, so one
  # public URL serves both the SPA and the API. Set NGROK_AUTHTOKEN in `.env`
  # (required for reserved domains and higher limits; optional for ephemeral
  # URLs). Set NGROK_DOMAIN to use a reserved/static domain.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      - web
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    # Use a reserved/static domain when NGROK_DOMAIN is set; otherwise ngrok
    # assigns a random ephemeral URL. `$$` escapes the var for the container
    # shell so compose does not interpolate it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          exec ngrok http web:80 --log=stdout --domain "$$NGROK_DOMAIN"
        else
          exec ngrok http web:80 --log=stdout
        fi
    ports:
      - "4040:4040"
    networks:
      - amber

volumes:
  db-data:
  # The API's rotating log files (see LOG_DIR). A named volume, not a bind
  # mount: the container image creates /app/logs owned by the non-root `app`
  # user, and Docker seeds a named volume from that directory with its
  # ownership intact -- a bind mount would take the host's permissions instead.
  api-logs:

networks:
  amber: