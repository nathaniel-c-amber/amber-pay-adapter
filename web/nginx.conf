# Minimal nginx config for the Amber Pay Ledger SPA.
# Serves the static build and falls back to /index.html for client-side
# (hash) routing. No server-side logic.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Compression --------------------------------------------------------
  # The app ships ~440 kB of JavaScript and ~55 kB of CSS uncompressed. Both
  # are highly compressible text, so this is the largest single load-time win
  # available and costs one block of configuration.
  #
  # woff2 is deliberately NOT in gzip_types: it is already a compressed format,
  # so gzipping it would spend CPU to produce a very slightly larger file.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # --- API proxy ----------------------------------------------------------
  # Proxied to the backend service (docker-compose "api" on :3300) so the SPA
  # and the API share one origin — no CORS preflight on data calls. The API is
  # bound to loopback in docker-compose so this is the only way in.
  location /api/ {
    proxy_pass http://api:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Hashed assets ------------------------------------------------------
  # Content-addressed by Vite, so they can be cached indefinitely.
  #
  # SECURITY NOTE: this location sets its own `add_header`, and nginx does not
  # merge `add_header` across levels — a single location-level directive drops
  # everything inherited from `server`. Hence the explicit include; without it
  # assets would be served with NO security headers and nothing would look
  # wrong. See security-headers.conf.
  location /assets/ {
    try_files $uri =404;
    # One header, not `expires` + `add_header`: those two emit SEPARATE
    # Cache-Control lines, which is legal but ambiguous for intermediaries to
    # merge. Restating max-age keeps this the single source of truth.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # --- SPA fallback -------------------------------------------------------
  # Any non-asset path serves index.html. index.html must never be cached
  # stale, so it is revalidated on every request. Same add_header caveat as
  # above: this include is required, not redundant.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}