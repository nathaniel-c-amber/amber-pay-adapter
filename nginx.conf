# Minimal nginx config for the Amber Pay SPA.
# Serves the static build and falls back to /index.html for client-side
# routing (React Router / TanStack). No server-side logic.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed assets aggressively; they are content-addressed by Vite.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: any non-asset path serves index.html. index.html must not be
  # cached stale, so it is revalidated on every request.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}